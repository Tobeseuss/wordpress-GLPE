name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check (7.2 – 8.3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Keyword guard (hosting scanner simulation)
        run: bash tools/guard.sh
      - name: Lint all PHP files
        run: |
          find glpe-viewer -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run self-test suite
        run: php tools/selftest.php

  js-check:
    name: JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check client script
        run: node --check glpe-viewer/includes/client.js
